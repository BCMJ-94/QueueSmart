<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QueueSmart ✨</title>
<!-- Cute rounded font. If offline, the browser falls back to system fonts. -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== THEME: soft pastel colors ===== */
:root{--bg1:#ffeef5;--bg2:#eef0ff;--card:#ffffffcc;--tx:#4a3f5c;--mu:#9a8fae;--pr:#b48cf2;--pk:#ff9ec7;
--mint:#7fd8b8;--bd:#f1dcf5;--er:#e5537a;--wn:#f0a04b;--sh:0 8px 24px #b48cf233}
*{box-sizing:border-box}
body{margin:0;font:600 15px Quicksand,system-ui,sans-serif;color:var(--tx);
 background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}

/* ===== LAYOUT: top bar, nav pills, centered content ===== */
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);
 backdrop-filter:blur(8px);border-bottom:2px dashed var(--bd);flex-wrap:wrap}
header b{font-size:20px;color:var(--pr)}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
main{max-width:960px;margin:20px auto;padding:0 16px}

/* ===== CARDS, BUTTONS, FORMS ===== */
.card{background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.btn,nav button{font:inherit;border:2px solid var(--bd);background:#fff;color:var(--tx);padding:7px 15px;
 border-radius:99px;cursor:pointer;transition:transform .15s}
.btn:hover,nav button:hover{transform:translateY(-2px)}
.btn.p,nav button.on{background:linear-gradient(135deg,var(--pk),var(--pr));color:#fff;border-color:transparent}
.btn.d{color:var(--er)}.btn:disabled{opacity:.45;cursor:default;transform:none}
h2{margin:0 0 14px;font-size:24px}h3{margin:0 0 8px}
label{display:block;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 14px;border:2px solid var(--bd);border-radius:16px;background:#fff;color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pr)}
.err{color:var(--er);font-size:13px;min-height:16px}   /* validation messages */
.mu{color:var(--mu);font-size:13px}

/* ===== TABLES, BADGES, MISC ===== */
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:2px dotted var(--bd)}
.badge{padding:3px 11px;border-radius:99px;font-size:12px;background:#fff;border:2px solid var(--bd)}
.high{color:var(--er)}.medium{color:var(--wn)}.low,.open{color:#2fa57f}   /* priority + open colors */
.big{font-size:46px;font-weight:700;color:var(--pr)}                      /* big queue number */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
#bell{position:relative}
#bell i{position:absolute;top:-6px;right:-4px;background:var(--er);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;font-style:normal}
#toast{position:fixed;bottom:20px;right:20px;background:var(--pr);color:#fff;padding:11px 18px;border-radius:99px;display:none;box-shadow:var(--sh)}
.auth{max-width:390px;margin:50px auto;text-align:center}.auth form{text-align:left}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
</style></head><body>
<div id="root"></div><div id="toast"></div>

<script>
/* ==========================================================
   QueueSmart front-end (A2) - plain HTML/CSS/JS, mock data only
   No backend: everything lives in the object "S" below and
   the screen is redrawn by render() whenever S changes.
   ========================================================== */

// Small helpers: $ finds an element, now() gives a readable timestamp
const $ = s => document.querySelector(s), now = () => new Date().toLocaleString();

// ---------- MOCK DATA / APP STATE ----------
const S = {
  role: null,          // null = logged out, 'user' or 'admin'
  email: '',
  view: 'login',       // which screen is showing
  auth: 'login',       // login/register tab
  my: null,            // id of the service the user is queued in
  showN: false,        // is the notification panel open?
  unread: 2,           // unread notification count
  qsel: 1,             // service selected in Queue Management
  edit: null,          // service being edited (null = creating new)
  svcs: [              // each service: name, description, minutes per person, priority, open flag, queue of names
    {id:1, name:'General Consultation', desc:'Standard doctor visit', dur:15, pri:'medium', open:true, q:['Ava M.','Ben R.','Chloe T.']},
    {id:2, name:'Urgent Care', desc:'Time-sensitive issues', dur:10, pri:'high', open:true, q:['Dan K.']},
    {id:3, name:'Music Lesson', desc:'30 minute private lesson', dur:30, pri:'low', open:false, q:[]}
  ],
  hist: [
    {d:'2026-09-12', s:'General Consultation', o:'Served'},
    {d:'2026-08-30', s:'Music Lesson', o:'Left queue'}
  ],
  notes: [{m:'Welcome to QueueSmart! 🎀', t:'Today'}, {m:'Urgent Care queue is now open.', t:'Today'}]
};

// Find a service by id, and find "You" in its queue (1-based position, 0 = not in queue)
const svc = id => S.svcs.find(x => x.id == id);
const pos = s => s.q.indexOf('You') + 1;
const today = () => new Date().toISOString().slice(0, 10);

// ---------- NOTIFICATIONS (in-app only) ----------
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }
function notify(m){ S.notes.unshift({m, t: now()}); S.unread++; toast(m); }   // saves it AND pops a toast// ---------- NAVIGATION ----------
function go(v){ S.view = v; S.showN = false; render(); }
const USER_NAV  = [['dash','🏠 Dashboard'],['join','🎟️ Join Queue'],['status','⏳ Status'],['hist','📖 History']];
const ADMIN_NAV = [['adash','🏠 Dashboard'],['svcm','🧸 Services'],['qm','📋 Queues']];
// ---------- MAIN RENDER: draws login screen OR header + current view ----------
function render(){
 if(!S.role){ $('#root').innerHTML = authView(); return; }
 const nav = (S.role == 'admin' ? ADMIN_NAV : USER_NAV)
   .map(([k,l]) => `<button class="${S.view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#root').innerHTML = `
<header><b>🎀 QueueSmart</b><nav>${nav}</nav>
<button class="btn" id="bell" onclick="S.showN=!S.showN;S.unread=0;render()">🔔${S.unread ? `<i>${S.unread}</i>` : ''}</button>
<span class="mu">${S.email}</span>
<button class="btn" onclick="S.role=null;S.view='login';render()">Log out</button></header>
<main>
   ${S.showN ? `<div class="card"><h3>🔔 Notifications</h3>${S.notes.map(n => `<div>• ${n.m} <span class="mu">${n.t}</span></div>`).join('')}</div>` : ''}
   ${V[S.view]()}
</main>`;
}
// ---------- AUTH: Login + Registration ----------
function authView(){
 const r = S.auth == 'reg';
 // NOTE: this is a <div>, not a <form> - some sandboxed previews block real form
 // submission (they need an "allow-forms" permission we don't control), which would
 // stop our validation from ever running. A plain button + onclick avoids that.
 return `<div class="card auth"><h2>🎀 QueueSmart</h2>
<div class="tabs"><button class="btn ${r?'':'p'}" onclick="S.auth='login';render()">Login</button>
<button class="btn ${r?'p':''}" onclick="S.auth='reg';render()">Register</button></div>
<div>
<label>Email (used as username)</label><input id="em" type="email" placeholder="you@example.com"><div class="err" id="e1"></div>
<label>Password</label><input id="pw" type="password" placeholder="At least 8 characters"><div class="err" id="e2"></div>
   ${r ? `<label>Confirm password</label><input id="pw2" type="password"><div class="err" id="e3"></div>` : ''}
<button class="btn p" style="width:100%;margin-top:10px" onclick="doAuth()">${r ? 'Create account' : 'Log in'}</button>
</div>
<p class="mu">✨ Tip: an email containing "admin" logs in as Administrator.</p></div>`;
}
// Client-side validation for login/register (required, email format, password length, match)
// Called directly from the button's onclick (no <form> submit event involved).
function doAuth(){
 const em = $('#em').value.trim(), pw = $('#pw').value, reg = S.auth == 'reg';
 let ok = true;
 const set = (id, m) => { $(id).textContent = m; if(m) ok = false; };   // show error text, mark form invalid
 set('#e1', !em ? 'Email is required.' : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) ? 'Enter a valid email.' : '');
 set('#e2', !pw ? 'Password is required.' : pw.length < 8 ? 'Minimum 8 characters.' : '');
 if(reg) set('#e3', $('#pw2').value !== pw ? 'Passwords do not match.' : '');
 if(ok){                                   // mock login: no server check
   S.role = /admin/i.test(em) ? 'admin' : 'user';
   S.email = em;
   S.view = S.role == 'admin' ? 'adash' : 'dash';
   render();
 }
}

// ---------- VIEWS: each function returns the HTML for one screen ----------
const V = {
 // USER: dashboard = my queue + notification summary + active services
 dash(){ return `<h2>Hi there! 🌸</h2>
<div class="grid">
<div class="card"><h3>Your queue</h3>
       ${S.my ? `<div class="big">#${pos(svc(S.my))}</div><div class="mu">${svc(S.my).name}</div>` : '<p class="mu">Not in a queue yet.</p>'}
<button class="btn" onclick="go('status')">View status</button></div>
<div class="card"><h3>Notifications</h3>${S.notes.slice(0,3).map(n => `<div>• ${n.m}</div>`).join('')}</div>
</div>
<div class="card"><h3>Active services</h3><table><tr><th>Service</th><th>Waiting</th><th>Est. wait</th><th>Status</th></tr>
     ${S.svcs.map(s => `<tr><td>${s.name}</td><td>${s.q.length}</td><td>${s.q.length * s.dur} min</td><td class="${s.open?'open':''}">${s.open?'Open':'Closed'}</td></tr>`).join('')}</table></div>`; },
 // USER: pick a service, see estimated wait, join or leave
 join(){ return `<h2>Join a Queue 🎟️</h2>` + S.svcs.map(s => {
     const inq = S.my == s.id;
     const est = inq ? (pos(s) * s.dur) : (s.q.length + 1) * s.dur;      // wait if you join now / your current wait
     return `<div class="card row"><div class="sp">
<h3>${s.name} <span class="badge ${s.pri}">${s.pri}</span></h3>
<div class="mu">${s.desc} · ${s.dur} min each</div>
<div>Estimated wait: <b>${est} min</b> (${s.q.length} waiting)</div></div>
       ${inq ? `<button class="btn d" onclick="leave()">Leave queue</button>`
             : `<button class="btn p" ${!s.open || S.my ? 'disabled' : ''} onclick="join(${s.id})">${s.open ? 'Join' : 'Closed'}</button>`}
</div>`; }).join('') + (S.my ? '<p class="mu">You can only be in one queue at a time.</p>' : ''); },
 // USER: current position, wait time, status (waiting / almost ready)
 status(){
   if(!S.my) return `<h2>Queue Status ⏳</h2><div class="card">You are not in a queue. <button class="btn p" onclick="go('join')">Join one</button></div>`;
   const s = svc(S.my), p = pos(s), st = p == 1 ? ['Almost ready 💛','medium'] : ['Waiting 💤',''];
   return `<h2>Queue Status ⏳</h2><div class="card"><h3>${s.name}</h3><div class="big">#${p}</div>
<p>Estimated wait: <b>${p * s.dur} min</b></p>
<p>Status: <span class="badge ${st[1]}">${st[0]}</span></p>
<p class="mu">Waiting → Almost ready → Served</p>
<button class="btn p" onclick="serve(${s.id})">Simulate: serve next</button>
<button class="btn d" onclick="leave()">Leave queue</button></div>`; },
 // USER: past queues (date, service, outcome)
 hist(){ return `<h2>History 📖</h2><div class="card"><table><tr><th>Date</th><th>Service</th><th>Outcome</th></tr>
   ${S.hist.map(h => `<tr><td>${h.d}</td><td>${h.s}</td><td>${h.o}</td></tr>`).join('')}</table></div>`; },
 // ADMIN: services, queue lengths, open/close quick action
 adash(){ return `<h2>Admin Dashboard 🏠</h2><div class="card"><table><tr><th>Service</th><th>Queue length</th><th>Status</th><th>Action</th></tr>
   ${S.svcs.map(s => `<tr><td>${s.name}</td><td>${s.q.length}</td><td class="${s.open?'open':''}">${s.open?'Open':'Closed'}</td>
<td><button class="btn" onclick="tog(${s.id})">${s.open?'Close':'Open'} queue</button></td></tr>`).join('')}</table></div>`; },
 // ADMIN: create / edit services (with validation in saveSvc)
 svcm(){
   const e = S.edit || {name:'', desc:'', dur:'', pri:'medium'};      // blank form when creating
   return `<h2>Service Management 🧸</h2>
<div class="card"><table><tr><th>Service</th><th>Duration</th><th>Priority</th><th></th></tr>
     ${S.svcs.map(s => `<tr><td>${s.name}</td><td>${s.dur} min</td><td class="${s.pri}">${s.pri}</td>
<td><button class="btn" onclick="S.edit={...svc(${s.id})};render()">Edit</button></td></tr>`).join('')}</table></div>
<div class="card"><h3>${e.id ? 'Edit' : 'Create'} service</h3>
<!-- plain <div>, not <form>, for the same sandboxed-iframe reason as the login screen -->
<div>
<label>Service name (required, max 100)</label>
<input id="sn" maxlength="100" value="${e.name}" oninput="$('#cnt').textContent=this.value.length+'/100'">
<div class="row"><span class="err sp" id="s1"></span><span class="mu" id="cnt">${e.name.length}/100</span></div>
<label>Description (required)</label><textarea id="sd" rows="2">${e.desc}</textarea><div class="err" id="s2"></div>
<label>Expected duration (minutes, required)</label><input id="su" type="number" min="1" max="480" value="${e.dur}"><div class="err" id="s3"></div>
<label>Priority level</label><select id="sp">${['low','medium','high'].map(p => `<option ${e.pri==p?'selected':''}>${p}</option>`).join('')}</select>
<p><button class="btn p" onclick="saveSvc()">Save service</button> ${e.id ? `<button class="btn" onclick="S.edit=null;render()">Cancel</button>` : ''}</p>
</div></div>`; },
 // ADMIN: view one service's queue, reorder / remove / serve next (UI only)
 qm(){
   const s = svc(S.qsel);
   return `<h2>Queue Management 📋</h2><div class="card">
<div class="row"><select style="width:auto" onchange="S.qsel=+this.value;render()">
       ${S.svcs.map(x => `<option value="${x.id}" ${x.id==S.qsel?'selected':''}>${x.name}</option>`).join('')}</select>
<span class="sp"></span><button class="btn p" ${s.q.length ? '' : 'disabled'} onclick="serve(${s.id})">Serve next</button></div>
     ${s.q.length ? `<table>${s.q.map((n,i) => `<tr><td>${i+1}</td><td>${n}</td><td>
<button class="btn" ${i ? '' : 'disabled'} onclick="mv(${i},-1)">↑</button>
<button class="btn" ${i < s.q.length-1 ? '' : 'disabled'} onclick="mv(${i},1)">↓</button>
<button class="btn d" onclick="rm(${i})">Remove</button></td></tr>`).join('')}</table>` : '<p class="mu">Queue is empty 🌙</p>'}
</div>`; }
};

// User joins a queue

function join(id){ const s = svc(id); s.q.push('You'); S.my = id; notify('You joined ' + s.name + '. Position #' + pos(s)); render(); }
 
// User leaves their queue -> saved to history

function leave(){

  const s = svc(S.my);

  s.q = s.q.filter(n => n != 'You');

  S.hist.unshift({d: today(), s: s.name, o: 'Left queue'});

  S.my = null; toast('You left the queue'); render();

}
 
// Serve the next person. If that was "You", status becomes Served; if You are now first, "almost ready"

function serve(id){

  const s = svc(id), n = s.q.shift();

  if(n == 'You'){ S.hist.unshift({d: today(), s: s.name, o: 'Served'}); S.my = null; notify('Status: Served. Thank you! 💖'); }

  else if(n && pos(s) == 1) notify('Almost ready - you are next in ' + s.name + '!');

  else if(n) notify('Queue updated: ' + n + ' was served.');

  render();

}
 
// Admin opens/closes a queue

function tog(id){ const s = svc(id); s.open = !s.open; notify(s.name + ' queue ' + (s.open ? 'opened' : 'closed')); render(); }
 
// Admin reorders (swap with neighbor) or removes a person

function mv(i, d){ const q = svc(S.qsel).q; [q[i], q[i+d]] = [q[i+d], q[i]]; render(); }

function rm(i){ const s = svc(S.qsel), n = s.q.splice(i, 1)[0]; if(n == 'You'){ S.my = null; notify('You were removed from ' + s.name); } render(); }
 
// Service form validation: name required + max 100, description required, duration whole number 1-480

function saveSvc(e){

  e.preventDefault();

  const n = $('#sn').value.trim(), d = $('#sd').value.trim(), u = $('#su').value;

  let ok = true;

  const set = (i, m) => { $(i).textContent = m; if(m) ok = false; };

  set('#s1', !n ? 'Name is required.' : n.length > 100 ? 'Max 100 characters.' : '');

  set('#s2', !d ? 'Description is required.' : '');

  set('#s3', !u ? 'Duration is required.' : !(+u >= 1 && +u <= 480) || !Number.isInteger(+u) ? 'Enter a whole number, 1-480.' : '');

  if(!ok) return false;

  const p = $('#sp').value;

  if(S.edit && S.edit.id) Object.assign(svc(S.edit.id), {name: n, desc: d, dur: +u, pri: p});          // update existing

  else S.svcs.push({id: Date.now(), name: n, desc: d, dur: +u, pri: p, open: true, q: []});             // create new

  S.edit = null; toast('Service saved ✨'); render(); return false;

}

render();   // first draw: shows the login screen
</script></body></html>
